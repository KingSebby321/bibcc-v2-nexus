<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIBCC AML/KYC Fines</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .spinner {
            display: none;
            margin: 20px auto;
            width: 50px;
            height: 50px;
            border: 5px solid rgb(169, 38, 230);
            border-top: 5px solid rgb(177, 161, 223);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>BIBCC AML/KYC Fines Dashboard</h1>

        <!-- Loading Spinner -->
        <div class="spinner" id="loadingSpinner"></div>

        <!-- Search Input -->
        <div class="form-group mt-3">
            <input type="text" id="searchInput" class="form-control" placeholder="Search by Entity, Country, or Fine Type">
        </div>

        <!-- Data Table -->
        <table class="table mt-3">
            <thead>
                <tr>
                    <th id="sortId">ID</th>
                    <th id="sortEntity">Entity</th>
                    <th id="sortFineType">Fine Type</th>
                    <th id="sortCountry">Country</th>
                    <th id="sortFineAmount">Fine Amount</th>
                    <th id="sortNotes">Notes</th>
                </tr>
            </thead>
            <tbody id="data-table"></tbody>
        </table>

        <!-- Pagination Controls -->
        <nav aria-label="Page navigation">
            <ul class="pagination" id="pagination-controls"></ul>
        </nav>

        <!-- Chart Canvas -->
        <canvas id="myChart" width="400" height="200"></canvas>
    </div>

    <!-- JavaScript Code -->
    <script>
        const itemsPerPage = 10;
        let currentPage = 1;
        let data = [];

        // Show spinner while data is loading
        const spinner = document.getElementById('loadingSpinner');
        spinner.style.display = 'block';

        // Fetch data from the Flask API and populate the table and chart
        fetch('/aml_fines_data')  // This is the API endpoint for AML fines data
            .then(response => response.json())
            .then(fetchedData => {
                spinner.style.display = 'none'; // Hide spinner once data is loaded
                if (fetchedData.length === 0) {
                    alert('No data available');
                    return;
                }
                data = fetchedData;
                displayData(data, currentPage);
                populateChart(data);
            })
            .catch(error => {
                spinner.style.display = 'none'; // Hide spinner in case of error
                console.error('Error fetching data:', error);
                alert('Failed to load data. Please try again later.');
            });

        // Function to display data in the table with pagination
        function displayData(filteredData, page = 1) {
            const tableBody = document.getElementById('data-table');
            const paginationControls = document.getElementById('pagination-controls');
            tableBody.innerHTML = ''; // Clear previous results

            const startIndex = (page - 1) * itemsPerPage;
            const paginatedData = filteredData.slice(startIndex, startIndex + itemsPerPage);

            paginatedData.forEach(item => {
                let row = `<tr>
                    <td>${item.ID}</td>
                    <td>${item.Entity}</td>
                    <td>${item.FineType}</td>
                    <td>${item.Country}</td>
                    <td>${item.FineAmount}</td>
                    <td>${item.Notes}</td>
                </tr>`;
                tableBody.innerHTML += row;
            });

            displayPagination(filteredData.length, page);
        }

        // Function to display pagination controls
        function displayPagination(totalItems, currentPage) {
            const paginationControls = document.getElementById('pagination-controls');
            paginationControls.innerHTML = '';

            const totalPages = Math.ceil(totalItems / itemsPerPage);
            for (let i = 1; i <= totalPages; i++) {
                let pageItem = document.createElement('li');
                pageItem.classList.add('page-item');
                if (i === currentPage) pageItem.classList.add('active');
                pageItem.innerHTML = `<a class="page-link" href="#">${i}</a>`;
                pageItem.addEventListener('click', () => displayData(data, i));
                paginationControls.appendChild(pageItem);
            }
        }

        // Chart population
        function populateChart(data) {
            let fineCounts = {};
            data.forEach(item => {
                if (item.Country in fineCounts) {
                    fineCounts[item.Country]++;
                } else {
                    fineCounts[item.Country] = 1;
                }
            });

            let labels = Object.keys(fineCounts);
            let values = Object.values(fineCounts);

            let ctx = document.getElementById('myChart').getContext('2d');
            let myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Fines by Country',
                        data: values,
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(tooltipItem) {
                                    return tooltipItem.raw + ' fines';
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
